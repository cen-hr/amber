<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退休相關 · 員工服務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2B29;
    --ink-soft:#4C5C59;
    --bg:#EEF3F0;
    --paper:#FFFFFF;
    --line:#DCE4E0;
    --teal:#1F5C56;
    --teal-deep:#153F3B;
    --sage:#7FA694;
    --amber:#C98A2C;
    --amber-soft:#F3E2C2;
    --shadow: 0 8px 24px rgba(21,63,59,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #E3EEE8 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 10%, #EAF1EC 0%, transparent 55%),
      var(--bg);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px 80px;
  }
  .stage{ width:100%; max-width:600px; display:grid; gap:22px; }
  .stage-header{ text-align:center; }
  .stage-header .eyebrow{
    font-size:12.5px; letter-spacing:.16em; color:var(--teal);
    font-weight:700; text-transform:uppercase;
  }
  .stage-header h1{ font-family:'Noto Serif TC', serif; font-size:24px; margin:6px 0 2px; color:var(--teal-deep); }
  .stage-header p{ margin:0; color:var(--ink-soft); font-size:13.5px; }

  .phone-wrap{ display:flex; justify-content:center; }
  .phone{
    width:390px; max-width:100%; height:780px;
    background:var(--paper); border-radius:38px;
    box-shadow: var(--shadow), 0 0 0 10px #0F2E2A;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:120px; height:22px; background:#0F2E2A; border-radius:14px; z-index:30;
  }
  .topbar{
    background:linear-gradient(180deg, var(--teal) 0%, var(--teal-deep) 100%);
    color:#EFF6F3; padding:34px 18px 14px; position:relative; z-index:10;
  }
  .topbar .row{ display:flex; align-items:center; gap:10px; min-height:26px; }
  .backbtn{
    width:30px;height:30px; border-radius:50%;
    background:rgba(255,255,255,0.12); border:none; color:#fff;
    display:flex;align-items:center;justify-content:center; cursor:pointer;
    font-size:16px; flex:0 0 auto; transition:background .15s ease;
  }
  .backbtn:hover{ background:rgba(255,255,255,0.22); }
  .backbtn.hidden{ visibility:hidden; }
  .topbar h2{ font-family:'Noto Serif TC', serif; font-size:17px; margin:0; font-weight:600; }
  .topbar .sub{ font-size:11.5px; color:#CFE3DC; margin-top:2px; letter-spacing:.03em; }
  .crumbs{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .crumb{
    font-size:10.5px; background:rgba(255,255,255,0.14);
    padding:3px 9px; border-radius:100px; color:#DDEEE7; letter-spacing:.02em;
  }

  .screen-area{ flex:1; overflow-y:auto; background:#F7FAF8; padding:18px 16px 28px; }
  .screen-area::-webkit-scrollbar{ width:5px; }
  .screen-area::-webkit-scrollbar-thumb{ background:#C9D8D2; border-radius:10px; }

  .intro-card{
    background:linear-gradient(135deg, #FFFFFF 0%, #F1F7F3 100%);
    border:1px solid var(--line); border-radius:18px; padding:16px 16px; margin-bottom:14px;
  }
  .intro-card h3{ font-family:'Noto Serif TC', serif; margin:0 0 6px; font-size:15.5px; color:var(--teal-deep); }
  .intro-card p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }

  .list-row{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; display:flex; align-items:center; gap:12px; margin-bottom:9px;
    cursor:pointer; transition:border-color .15s ease, transform .15s ease;
  }
  .list-row:hover{ border-color:var(--sage); transform:translateX(2px); }
  .list-row .ic{ font-size:20px; flex:0 0 auto; }
  .list-row .txt{ flex:1; }
  .list-row .txt .t1{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .list-row .txt .t2{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .list-row .chev{ color:var(--sage); font-size:14px; }

  .journey{ display:flex; align-items:center; gap:4px; margin:2px 0 16px; padding:0 2px; }
  .journey .stop{ flex:1; text-align:center; }
  .journey .dot{
    width:26px;height:26px; border-radius:50%; background:var(--paper);
    border:2px solid var(--sage); display:flex;align-items:center;justify-content:center;
    margin:0 auto 4px; font-size:13px;
  }
  .journey .stop.active .dot{ background:var(--amber); border-color:var(--amber); }
  .journey .stop .lab{ font-size:10px; color:var(--ink-soft); }
  .journey .bar{ flex:0 0 20px; height:2px; background:var(--line); margin-top:-16px; }

  .info-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:15px 16px; margin-bottom:12px; }
  .info-card h4{
    margin:0 0 8px; font-size:14.5px; font-family:'Noto Serif TC', serif; color:var(--teal-deep);
    display:flex; align-items:center; gap:6px;
  }
  .info-card ul{ margin:0; padding-left:18px; font-size:12.5px; color:var(--ink-soft); line-height:1.7; }
  .info-card ul li strong{ color:var(--ink); }
  .tag{
    display:inline-block; font-size:10px; background:var(--amber-soft); color:#8A5A19;
    padding:2px 8px; border-radius:100px; margin-left:6px; font-weight:700; vertical-align:middle;
  }

  .apply-block{ margin-top:16px; }
  .apply-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.03em; }
  .apply-link{
    display:flex; align-items:center; gap:10px; border-radius:14px; padding:13px 14px;
    margin-bottom:8px; text-decoration:none; transition:transform .15s ease, filter .15s ease;
  }
  .apply-link:hover{ transform:translateY(-2px); }
  .apply-link.online{ background:var(--teal); color:#fff; }
  .apply-link.online .al-sub{ color:#CFE3DC; }
  .apply-link.form{ background:#fff; border:1.5px solid var(--teal); color:var(--teal-deep); }
  .apply-link.form .al-sub{ color:var(--ink-soft); }
  .apply-link .al-text{ flex:1; display:flex; flex-direction:column; gap:2px; }
  .apply-link .al-main{ font-size:13px; font-weight:700; line-height:1.4; }
  .apply-link .al-sub{ font-size:10.5px; font-weight:400; }
  .apply-link .al-arrow{ font-size:15px; font-weight:700; flex:0 0 auto; }

  .closed-box{
    background:#F1F7F3; border:1px dashed var(--sage); border-radius:16px;
    padding:22px 18px; text-align:center; margin-top:8px;
  }
  .closed-box .ic{ font-size:26px; margin-bottom:8px; }
  .closed-box p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.7; }

  .footnote{ text-align:center; font-size:10.5px; color:#9AAEA8; margin-top:18px; line-height:1.6; }
  .panel-note{ max-width:390px; margin:0 auto; font-size:12px; color:var(--ink-soft); text-align:center; line-height:1.7; }
  .panel-note b{ color:var(--teal-deep); }

  @media (max-width:460px){
    .phone{ border-radius:0; height:100vh; box-shadow:none; }
    body{ padding:0; }
    .notch{ display:none; }
    .stage-header{ display:none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stage-header">
    <div class="eyebrow">HR SERVICE MENU · 退休相關</div>
    <h1>👴 退休相關</h1>
    <p>快速找到您需要的資訊</p>
  </div>

  <div class="phone-wrap">
    <div class="phone">
      <div class="notch"></div>
      <div class="topbar">
        <div class="row">
          <button class="backbtn hidden" id="backBtn" onclick="goBack()">‹</button>
          <div>
            <h2 id="titleText">👴 退休相關</h2>
            <div class="sub" id="subText">快速找到您需要的資訊</div>
          </div>
        </div>
        <div class="crumbs" id="crumbs"></div>
      </div>
      <div class="screen-area" id="screenArea"></div>
    </div>
  </div>

  <div class="panel-note">按上方手機畫面操作即可預覽點擊路徑：<b>退休相關首頁 → 情境選擇 → 知識說明 → 辦理方式</b></div>
</div>

<script>
const retireScenarios = [
  {ic:'🎂', t1:'我符合退休資格了（舊制退休金）', t2:'退休資格・退休金計算・應備文件', key:'retire_company'},
  {ic:'💼', t1:'我要請領勞保老年給付', t2:'請領資格・給付方式・應備文件', key:'retire_bli'},
  {ic:'📂', t1:'我要請領勞退新制個人專戶', t2:'請領資格・專戶查詢方式', key:'retire_pension'},
];

const applyLinks = {
  retire_company:{
    note:'舊制退休金由公司一次現金給付，計算與申請請直接洽人事室，<strong>無須向勞保局申請</strong>。'
  },
  retire_bli:{
    online:{ label:'勞保局 e 化服務系統', url:'https://edesk.bli.gov.tw/me/#/home', note:'登入後選擇「老年給付」申辦' },
    forms:[
      {name:'老年給付申請書', url:'https://www.bli.gov.tw/0103242.html'},
    ]
  },
  retire_pension:{
    online:{ label:'勞保局 e 化服務系統', url:'https://edesk.bli.gov.tw/me/#/home', note:'登入後選擇「勞工退休金個人專戶」查詢／試算／申請' },
    forms:[
      {name:'勞工退休金書表下載總覽', url:'https://www.bli.gov.tw/0005596.html'},
    ]
  },
};

const retireDetail = {
  retire_company:{
    step:1,
    title:'🎂 我符合退休資格了（舊制退休金）',
    cards:[
      {h:'適用對象？<span class="tag">舊制年資</span>', items:[
        '適用對象：<strong>2005 年勞退新制上路前</strong>的工作年資（或選擇繼續適用舊制者）',
        '2005 年後的年資，改看「📂 勞退新制個人專戶」那張卡片，兩者互不影響'
      ]},
      {h:'退休資格（勞基法）', items:[
        '自請退休：工作 <strong>15 年</strong>以上年滿 <strong>55 歲</strong>；或工作 <strong>25 年</strong>以上不限年齡；或工作 <strong>10 年</strong>以上年滿 <strong>60 歲</strong>（符合其一即可）',
        '強制退休：年滿 <strong>65 歲</strong>，或心神喪失／身體殘廢不堪勝任工作'
      ]},
      {h:'退休金怎麼算', items:[
        '前 15 年：每滿 1 年給 <strong>2 個基數</strong>',
        '第 15 年後：每滿 1 年給 <strong>1 個基數</strong>，最高總計 <strong>45 個基數</strong>',
        '1 個基數＝退休前 6 個月平均工資',
        '由公司一次現金給付，不須自行申請勞保局或勞退局'
      ]},
      {h:'應備文件', items:[
        '退休申請書（院內制式表單）',
        '身分證正反面影本',
        '存摺封面影本（退休金匯款帳戶）'
      ]},
    ]
  },
  retire_bli:{
    step:2,
    title:'💼 我要請領勞保老年給付',
    cards:[
      {h:'請領資格', items:[
        '2026 年法定請領年齡：<strong>65 歲</strong>（保險年資滿 15 年以上，可請領「老年年金」）',
        '年資未滿 15 年者：請領「老年一次金」，每滿 1 年發 1 個月，最高 45 個月',
        '可提前最多 5 年請領（60 歲起，每提前 1 年減給 4%），亦可延後最多 5 年（每延後 1 年增給 4%）',
        '98 年 1 月 1 日勞保年金施行前已有勞保年資者，才可選擇「一次請領老年給付」'
      ]},
      {h:'應備文件', items:[
        '身分證明文件（核對用）',
        '存摺封面影本',
        '委託他人代辦者需檢附委託書'
      ]},
    ]
  },
  retire_pension:{
    step:3,
    title:'📂 我要請領勞退（新制）個人專戶',
    cards:[
      {h:'請領資格', items:[
        '年滿 <strong>60 歲</strong>，不論在職與否即可申請，與是否離職無關',
        '提繳年資滿 15 年以上：可選擇「月退休金」或「一次退休金」',
        '提繳年資未滿 15 年：僅能請領「一次退休金」',
        '未滿 60 歲但已領取勞保失能年金或身心障礙年金者，可提前請領'
      ]},
      {h:'個人專戶查詢', items:[
        '專戶金額所有權屬於勞工本人，<strong>雇主不得查詢</strong>員工個人專戶金額',
        '可透過勞保局 e 化服務系統、勞動保障卡至郵局 ATM，或臨櫃查詢與試算'
      ]},
    ]
  },
};

let history = ['retire_home'];

function render(key){
  const area = document.getElementById('screenArea');
  const backBtn = document.getElementById('backBtn');
  const titleText = document.getElementById('titleText');
  const subText = document.getElementById('subText');
  const crumbs = document.getElementById('crumbs');

  backBtn.classList.toggle('hidden', history.length <= 1);

  let crumbTrail = [];
  let html = '';

  if(key === 'retire_home'){
    titleText.textContent = '👴 退休相關';
    subText.textContent = '快速找到您需要的資訊';
    html = `<div class="intro-card">
      <h3>請選擇您目前的情況</h3>
      <p>依照您現在遇到的情境，點選最貼近的選項。</p>
    </div>` + retireScenarios.map(s=>`
      <div class="list-row" onclick="go('${s.key}')">
        <div class="ic">${s.ic}</div>
        <div class="txt"><div class="t1">${s.t1}</div><div class="t2">${s.t2}</div></div>
        <div class="chev">›</div>
      </div>`).join('');
  }

  else if(retireDetail[key]){
    const d = retireDetail[key];
    const links = applyLinks[key];
    titleText.textContent = d.title;
    subText.textContent = '知識說明';
    crumbTrail = ['退休相關'];
    html = journeyHTML(d.step) +
      d.cards.map(c=>`
        <div class="info-card">
          <h4>${c.h}</h4>
          <ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>
        </div>`).join('');

    if(links && links.online){
      html += `
      <div class="apply-block">
        <div class="apply-label">🟢 線上申請</div>
        <a class="apply-link online" href="${links.online.url}" target="_blank" rel="noopener">
          <span class="al-text"><span class="al-main">${links.online.label}</span><span class="al-sub">${links.online.note}</span></span>
          <span class="al-arrow">↗</span>
        </a>
      </div>
      <div class="apply-block">
        <div class="apply-label">📄 表單下載</div>
        ${links.forms.map(f=>`
          <a class="apply-link form" href="${f.url}" target="_blank" rel="noopener">
            <span class="al-text"><span class="al-main">${f.name}</span></span>
            <span class="al-arrow">↓</span>
          </a>`).join('')}
      </div>`;
    } else if(links && links.note){
      html += `<div class="closed-box">
        <div class="ic">ℹ️</div>
        <p>${links.note}</p>
      </div>`;
    }
  }

  crumbs.innerHTML = crumbTrail.map(c=>`<span class="crumb">${c}</span>`).join('');
  area.innerHTML = html;
  area.scrollTop = 0;
}

function journeyHTML(step){
  const labels = ['舊制退休金','勞保給付','勞退專戶'];
  return `<div class="journey">` + labels.map((l,i)=>{
    const idx = i+1;
    return `<div class="stop ${idx===step?'active':''}"><div class="dot">${idx===step?'●':idx}</div><div class="lab">${l}</div></div>` +
      (i < labels.length-1 ? `<div class="bar"></div>` : '');
  }).join('') + `</div>`;
}

function go(key){
  history.push(key);
  render(key);
}
function goBack(){
  if(history.length>1){
    history.pop();
    render(history[history.length-1]);
  }
}

render('retire_home');
</script>
</body>
</html>
