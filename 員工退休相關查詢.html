<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退休相關 · 員工服務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2B29;
    --ink-soft:#4C5C59;
    --bg:#EEF3F0;
    --paper:#FFFFFF;
    --line:#DCE4E0;
    --teal:#1F5C56;
    --teal-deep:#153F3B;
    --sage:#7FA694;
    --amber:#C98A2C;
    --amber-soft:#F3E2C2;
    --shadow: 0 8px 24px rgba(21,63,59,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #E3EEE8 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 10%, #EAF1EC 0%, transparent 55%),
      var(--bg);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px 80px;
  }
  .stage{ width:100%; max-width:600px; display:grid; gap:22px; }
  .stage-header{ text-align:center; }
  .stage-header .eyebrow{
    font-size:12.5px; letter-spacing:.16em; color:var(--teal);
    font-weight:700; text-transform:uppercase;
  }
  .stage-header h1{ font-family:'Noto Serif TC', serif; font-size:24px; margin:6px 0 2px; color:var(--teal-deep); }
  .stage-header p{ margin:0; color:var(--ink-soft); font-size:13.5px; }

  .phone-wrap{ display:flex; justify-content:center; }
  .phone{
    width:390px; max-width:100%; height:780px;
    background:var(--paper); border-radius:38px;
    box-shadow: var(--shadow), 0 0 0 10px #0F2E2A;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:120px; height:22px; background:#0F2E2A; border-radius:14px; z-index:30;
  }
  .topbar{
    background:linear-gradient(180deg, var(--teal) 0%, var(--teal-deep) 100%);
    color:#EFF6F3; padding:34px 18px 14px; position:relative; z-index:10;
  }
  .topbar .row{ display:flex; align-items:center; gap:10px; min-height:26px; }
  .backbtn{
    width:30px;height:30px; border-radius:50%;
    background:rgba(255,255,255,0.12); border:none; color:#fff;
    display:flex;align-items:center;justify-content:center; cursor:pointer;
    font-size:16px; flex:0 0 auto; transition:background .15s ease;
  }
  .backbtn:hover{ background:rgba(255,255,255,0.22); }
  .backbtn.hidden{ visibility:hidden; }
  .topbar h2{ font-family:'Noto Serif TC', serif; font-size:17px; margin:0; font-weight:600; }
  .topbar .sub{ font-size:11.5px; color:#CFE3DC; margin-top:2px; letter-spacing:.03em; }

  .screen-area{ flex:1; overflow-y:auto; background:#F7FAF8; padding:18px 16px 28px; }
  .screen-area::-webkit-scrollbar{ width:5px; }
  .screen-area::-webkit-scrollbar-thumb{ background:#C9D8D2; border-radius:10px; }

  .intro-card{
    background:linear-gradient(135deg, #FFFFFF 0%, #F1F7F3 100%);
    border:1px solid var(--line); border-radius:18px; padding:16px 16px; margin-bottom:14px;
  }
  .intro-card h3{ font-family:'Noto Serif TC', serif; margin:0 0 6px; font-size:15.5px; color:var(--teal-deep); }
  .intro-card p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .intro-card.warm{
    background:linear-gradient(135deg, #FFF9F0 0%, #FBF0DE 100%);
    border-color:var(--amber-soft);
  }
  .intro-card.warm h3{ color:#8A5A19; font-size:17px; }
  .intro-card.warm p{ color:#6b5432; line-height:1.75; }

  .choice-box{ margin-top:18px; }
  .calc-card select{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Noto Sans TC', sans-serif; font-size:13px; color:var(--ink);
    background:#FBFCFB; margin-top:4px;
  }
  .calc-note{
    margin:12px 0 0; padding:12px 14px; background:#F1F7F3; border-radius:12px;
    font-size:12.5px; color:var(--ink); line-height:1.7;
  }
  .choice-title{ font-size:13px; font-weight:700; color:var(--ink); margin-bottom:10px; text-align:center; }
  .choice-btn{
    width:100%; display:flex; align-items:center; gap:12px;
    border-radius:14px; padding:14px 16px; margin-bottom:10px;
    border:1.5px solid var(--line); background:var(--paper); cursor:pointer;
    font-family:'Noto Sans TC', sans-serif; transition:transform .15s ease, border-color .15s ease;
  }
  .choice-btn:hover{ transform:translateY(-2px); border-color:var(--sage); }
  .choice-btn .cb-ic{ font-size:20px; flex:0 0 auto; }
  .choice-btn .cb-text{ flex:1; text-align:left; display:flex; flex-direction:column; gap:2px; }
  .choice-btn .cb-main{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .choice-btn .cb-sub{ font-size:11px; color:var(--ink-soft); }
  .choice-btn .cb-arrow{ font-size:15px; color:var(--sage); }
  .choice-btn.online{ border-color:var(--teal); }
  .choice-btn.onsite{ border-color:var(--amber); }

  .list-row{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; display:flex; align-items:center; gap:12px; margin-bottom:9px;
    cursor:pointer; transition:border-color .15s ease, transform .15s ease;
  }
  .list-row:hover{ border-color:var(--sage); transform:translateX(2px); }
  .list-row .ic{ font-size:20px; flex:0 0 auto; }
  .list-row .txt{ flex:1; }
  .list-row .txt .t1{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .list-row .txt .t2{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .list-row .chev{ color:var(--sage); font-size:14px; }

  .journey{ display:flex; align-items:center; gap:4px; margin:2px 0 16px; padding:0 2px; }
  .journey .stop{ flex:1; text-align:center; }
  .journey .dot{
    width:26px;height:26px; border-radius:50%; background:var(--paper);
    border:2px solid var(--sage); display:flex;align-items:center;justify-content:center;
    margin:0 auto 4px; font-size:13px;
  }
  .journey .stop.active .dot{ background:var(--amber); border-color:var(--amber); }
  .journey .stop .lab{ font-size:10px; color:var(--ink-soft); }
  .journey .bar{ flex:0 0 20px; height:2px; background:var(--line); margin-top:-16px; }

  .info-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:15px 16px; margin-bottom:12px; }
  .info-card h4{
    margin:0 0 8px; font-size:14.5px; font-family:'Noto Serif TC', serif; color:var(--teal-deep);
    display:flex; align-items:center; gap:6px;
  }
  .info-card ul{ margin:0; padding-left:18px; font-size:12.5px; color:var(--ink-soft); line-height:1.7; }
  .info-card ul li strong{ color:var(--ink); }
  .tag{
    display:inline-block; font-size:10px; background:var(--amber-soft); color:#8A5A19;
    padding:2px 8px; border-radius:100px; margin-left:6px; font-weight:700; vertical-align:middle;
  }

  .apply-block{ margin-top:16px; }
  .prep-box{
    background:#FFF8EC; border:1px solid var(--amber-soft); border-radius:14px;
    padding:14px 16px; margin-top:16px;
  }
  .prep-box .pb-title{
    font-size:12.5px; font-weight:700; color:#8A5A19; margin-bottom:8px;
    display:flex; align-items:center; gap:6px;
  }
  .prep-box ul{ margin:0; padding-left:18px; font-size:12px; color:#6b4f22; line-height:1.75; }
  .prep-box.onsite{ background:#EFF3F1; border-color:var(--sage); }
  .prep-box.onsite .pb-title{ color:var(--teal-deep); }
  .prep-box.onsite ul{ color:var(--ink-soft); }
  .onsite-card{
    background:var(--paper); border:1.5px solid var(--teal); border-radius:14px;
    padding:14px 16px; margin-top:10px;
  }
  .onsite-card .oc-label{ font-size:11px; font-weight:700; color:var(--teal); margin-bottom:6px; letter-spacing:.03em; }
  .onsite-card .oc-name{ font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .onsite-card .oc-row{ font-size:12px; color:var(--ink-soft); margin-bottom:3px; line-height:1.6; }
  .apply-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.03em; }
  .apply-link{
    display:flex; align-items:center; gap:10px; border-radius:14px; padding:13px 14px;
    margin-bottom:8px; text-decoration:none; transition:transform .15s ease, filter .15s ease;
  }
  .apply-link:hover{ transform:translateY(-2px); }
  .apply-link.online{ background:var(--teal); color:#fff; }
  .apply-link.online .al-sub{ color:#CFE3DC; }
  .apply-link.form{ background:#fff; border:1.5px solid var(--teal); color:var(--teal-deep); }
  .apply-link.form .al-sub{ color:var(--ink-soft); }
  .apply-link .al-text{ flex:1; display:flex; flex-direction:column; gap:2px; }
  .apply-link .al-main{ font-size:13px; font-weight:700; line-height:1.4; }
  .apply-link .al-sub{ font-size:10.5px; font-weight:400; }
  .apply-link .al-arrow{ font-size:15px; font-weight:700; flex:0 0 auto; }

  .form-row{ margin-bottom:12px; }
  .form-row label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; }
  .form-row input{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Noto Sans TC', sans-serif; font-size:13.5px; color:var(--ink);
    background:#FBFCFB;
  }
  .form-row input:focus{ outline:none; border-color:var(--teal); }
  .date-row{ display:flex; gap:8px; margin-bottom:4px; }
  .date-field{ flex:1; }
  .date-field label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; text-align:center; }
  .date-field input{
    width:100%; padding:10px 6px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'Noto Sans TC', sans-serif; font-size:14px; color:var(--ink);
    background:#FBFCFB; text-align:center;
  }
  .date-field input:focus{ outline:none; border-color:var(--teal); }
  .check-btn{
    width:100%; margin-top:4px; background:var(--teal); color:#fff; border:none;
    border-radius:12px; padding:12px; font-size:13.5px; font-weight:700; cursor:pointer;
    font-family:'Noto Sans TC', sans-serif; transition:filter .15s ease;
  }
  .check-btn:hover{ filter:brightness(1.08); }
  .status{
    display:inline-block; font-size:10px; font-weight:700; padding:2px 8px;
    border-radius:100px; margin-left:6px; vertical-align:middle;
  }
  .status.ok{ background:#E1F0E5; color:#1F7A3F; }
  .status.no{ background:#FBEFE7; color:#B4655C; }
  .status.na{ background:#EEF0EF; color:#8A9490; }

  .closed-box{
    background:#F1F7F3; border:1px dashed var(--sage); border-radius:16px;
    padding:22px 18px; text-align:center; margin-top:8px;
  }
  .closed-box .ic{ font-size:26px; margin-bottom:8px; }
  .closed-box p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.7; }

  .footnote{ text-align:center; font-size:10.5px; color:#9AAEA8; margin-top:18px; line-height:1.6; }
  .back-full{
    display:block; width:100%; margin-top:20px; background:#fff;
    border:1.5px solid var(--line); color:var(--teal-deep);
    border-radius:14px; padding:12px; font-size:13px; font-weight:700;
    font-family:'Noto Sans TC', sans-serif; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .back-full:hover{ border-color:var(--teal); background:#F1F7F3; }
  .panel-note{ max-width:390px; margin:0 auto; font-size:12px; color:var(--ink-soft); text-align:center; line-height:1.7; }
  .panel-note b{ color:var(--teal-deep); }

  @media (max-width:460px){
    .phone{ border-radius:0; height:100vh; box-shadow:none; }
    body{ padding:0; }
    .notch{ display:none; }
    .stage-header{ display:none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stage-header">
    <div class="eyebrow">HR SERVICE MENU · 退休相關</div>
    <h1>👴 退休相關</h1>
    <p>快速找到您需要的資訊</p>
  </div>

  <div class="phone-wrap">
    <div class="phone">
      <div class="notch"></div>
      <div class="topbar">
        <div class="row">
          <button class="backbtn hidden" id="backBtn" onclick="goBack()">‹</button>
          <div>
            <h2 id="titleText">👴 退休相關</h2>
            <div class="sub" id="subText">快速找到您需要的資訊</div>
          </div>
        </div>
      </div>
      <div class="screen-area" id="screenArea"></div>
    </div>
  </div>

  <div class="panel-note">按上方手機畫面操作即可預覽點擊路徑：<b>退休相關首頁 → 先確認資格或直接查看 → 知識說明 → 辦理方式</b></div>
</div>

      ]},

  },
};

let history = ['retire_home'];
let checkResult = null;

function calcBreakeven(){
  const sel = document.getElementById('claimAgeSelect');
  const box = document.getElementById('breakevenResult');
  if(!sel || !box) return;
  const age = parseInt(sel.value, 10);
  let html;
  if(age === 65){
    html = `<p class="calc-note">65歲是正常請領年齡，沒有增減——這是所有試算的比較基準。</p>`;
  } else if(age < 65){
    const yearsEarly = 65 - age;
    const reduce = yearsEarly * 4;
    const breakeven = Math.round((65-age)/ (reduce/100) + age);
    html = `<p class="calc-note">${age}歲請領，每月金額<strong>減少 ${reduce}%</strong>。<br>
      概略損益平衡點約在 <strong>${breakeven} 歲</strong>——活到這個歲數以前，${age}歲提前領總額比較高；活過這個歲數，等到65歲領反而更划算。</p>`;
  } else {
    const yearsLate = age - 65;
    const increase = yearsLate * 4;
    const breakeven = Math.round((age-65)/(increase/100) + age);
    html = `<p class="calc-note">${age}歲請領，每月金額<strong>增加 ${increase}%</strong>，但等待期間完全沒有年金收入。<br>
      概略損益平衡點約在 <strong>${breakeven} 歲</strong>——除非有把握活到這個歲數以上，數學上不一定比65歲正常請領划算。</p>`;
  }
  box.innerHTML = html;
}

function calcAge(birth, ref){
  let age = ref.getFullYear() - birth.getFullYear();
  const hadBirthday = (ref.getMonth() > birth.getMonth()) ||
    (ref.getMonth() === birth.getMonth() && ref.getDate() >= birth.getDate());
  if(!hadBirthday) age--;
  return age;
}

function runCheck(){
  const bY = parseInt(document.getElementById('birthY').value, 10);
  const bM = parseInt(document.getElementById('birthM').value, 10);
  const bD = parseInt(document.getElementById('birthD').value, 10);
  const jY = parseInt(document.getElementById('joinY').value, 10);
  const jM = parseInt(document.getElementById('joinM').value, 10);
  const jD = parseInt(document.getElementById('joinD').value, 10);

  if(!bY || !bM || !bD || !jY || !jM || !jD){
    alert('請完整填寫出生年月日與到職年月日（皆為西元年）');
    return;
  }

  const birthDate = new Date(bY, bM-1, bD);
  const joinDate = new Date(jY, jM-1, jD);
  const today = new Date();

  const age = calcAge(birthDate, today);
  const years = calcAge(joinDate, today);
  const cutoff = new Date(2005, 6, 1);
  const hasOld = joinDate < cutoff;

  let oldRow;
  if(!hasOld){
    oldRow = { key:'retire_company', ic:'🎂', t1:'舊制退休金', ok:null,
      badge:'不適用', t2:'2005年7月後到職，無舊制年資，退休金已全數在勞退新制專戶' };
  } else {
    const eligible = (years>=15 && age>=55) || years>=25 || (years>=10 && age>=60) || age>=65;
    oldRow = { key:'retire_company', ic:'🎂', t1:'舊制退休金', ok:eligible,
      badge: eligible ? '已符合' : '尚未符合',
      t2: eligible ? '符合自請退休資格，可直接申請' : '尚未達 15年+55歲／25年不限／10年+60歲／65歲強制 任一條件' };
  }

  let bliRow;
  if(age>=65){
    bliRow = { key:'retire_bli', ic:'💼', t1:'勞保老年給付', ok:true, badge:'已符合',
      t2:'已達法定請領年齡65歲，可以申請；實際請領方式（年金或一次金）需依您實際保險年資查詢確認' };
  } else if(age>=60){
    bliRow = { key:'retire_bli', ic:'💼', t1:'勞保老年給付', ok:true, badge:'已符合（可提前）',
      t2:'已達最早可提前請領年齡60歲；實際請領方式與是否減給，需依您實際保險年資查詢確認' };
  } else {
    bliRow = { key:'retire_bli', ic:'💼', t1:'勞保老年給付', ok:false, badge:'尚未符合',
      t2:`還差 ${60-age} 年到最快可提前請領的60歲` };
  }

  let pensionRow;
  if(age>=60){
    pensionRow = { key:'retire_pension', ic:'📂', t1:'勞退新制個人專戶', ok:true, badge:'已符合',
      t2:'已滿60歲，不論在職與否皆可請領' };
  } else {
    pensionRow = { key:'retire_pension', ic:'📂', t1:'勞退新制個人專戶', ok:false, badge:'尚未符合',
      t2:`還差 ${60-age} 年到60歲` };
  }

  checkResult = { age, years, hasOld, rows:[oldRow, bliRow, pensionRow] };
  go('retire_result');
}


function render(key){
  const area = document.getElementById('screenArea');
  const backBtn = document.getElementById('backBtn');

    </div>` + entryPaths.map(s=>`

    subText.textContent = '快速找到您需要的資訊';
    html = `<div class="intro-card">
      <h3>請選擇您目前的情況</h3>
      <p>依照您現在遇到的情境，點選最貼近的選項。</p>
    </div>` + retireScenarios.map(s=>`
      <div class="list-row" onclick="go('${s.key}')">
        <div class="ic">${s.ic}</div>

        <div class="chev">›</div>
      </div>`).join('');
  }

  else if(key === 'retire_check'){
    titleText.textContent = '🔍 資格自我檢測';
    subText.textContent = '輸入基本資料，快速看懂自己符合什麼';
    html = `<div class="intro-card">
      <h3>填寫兩組日期就好</h3>
      <p>僅供初步參考，正式資格與年資仍以人事室核定、勞保局資料為準。</p>
    </div>
    <div class="info-card">
      <h4>📋 出生年月日</h4>
      <div class="date-row">
        <div class="date-field"><label>年（西元）</label><input type="number" id="birthY" placeholder="1968"></div>
        <div class="date-field"><label>月</label><input type="number" id="birthM" placeholder="5" min="1" max="12"></div>
        <div class="date-field"><label>日</label><input type="number" id="birthD" placeholder="20" min="1" max="31"></div>
      </div>
    </div>
    <div class="info-card">
      <h4>📋 到職年月日</h4>
      <div class="date-row">
        <div class="date-field"><label>年（西元）</label><input type="number" id="joinY" placeholder="2005"></div>
        <div class="date-field"><label>月</label><input type="number" id="joinM" placeholder="3" min="1" max="12"></div>
        <div class="date-field"><label>日</label><input type="number" id="joinD" placeholder="1" min="1" max="31"></div>
      </div>
      <button class="check-btn" onclick="runCheck()">查看我符合哪些項目</button>
    </div>`;
  }

  else if(key === 'retire_result'){
    titleText.textContent = '✅ 檢測結果';
    subText.textContent = '點進項目查看詳細內容與辦理方式';
    html = `<div class="intro-card">
      <h3>依您輸入的資料</h3>
      <p>年齡 ${checkResult.age} 歲・到職年資約 ${checkResult.years} 年${checkResult.hasOld ? '（含舊制年資）' : '（無舊制年資，2005年7月後到職）'}</p>
    </div>` + checkResult.rows.map(r=>`
      <div class="list-row" onclick="go('${r.key}')">
        <div class="ic">${r.ic}</div>
        <div class="txt">
          <div class="t1">${r.t1} <span class="status ${r.ok===true?'ok':(r.ok===false?'no':'na')}">${r.badge}</span></div>

        <div class="chev">›</div>
      </div>`).join('') + `<div class="footnote">結果為初步估算，實際核定請以人事室與勞保局為準</div>`;
  }

  else if(retireDetail[key]){
    const d = retireDetail[key];
    const links = applyLinks[key];

    subText.textContent = '';
    html = journeyHTML(d.step) +
      d.cards.map(c=>`
        <div class="info-card">
          <h4>${c.h}</h4>
          <ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>
        </div>`).join('');

    if(key === 'retire_bli'){
      html += `

        <h4>🧮 我想試算看看(僅供參考!!)</h4>

          <label>如果我打算幾歲開始領？</label>
          <select id="claimAgeSelect" onchange="calcBreakeven()">

            <option value="63">63歲（提前2年）</option>

            <option value="69">69歲（延後4年）</option>
            <option value="70">70歲（延後5年）</option>
          </select>
        </div>
        <div id="breakevenResult"></div>
      </div>`;
    }

    if(links && links.online && links.onsite){
      html += `
      <div class="choice-box">

          <span class="cb-text"><span class="cb-main">線上申辦</span><span class="cb-sub">在家用手機或電腦完成</span></span>

    } else if(links && links.note){
      html += `<div class="closed-box">
        <div class="ic">ℹ️</div>

  else if(key.includes('|')){
    const [baseKey, mode] = key.split('|');
    const d = retireDetail[baseKey];
    const links = applyLinks[baseKey];
    titleText.textContent = d.title;
    subText.textContent = mode === 'online' ? '🟢 線上申辦' : '🏢 現場申辦';

    if(mode === 'online'){
      html = `
      <div class="prep-box">
        <div class="pb-title">🟢 線上辦，請先準備</div>
        <ul>
          <li>健保卡正本（本人的，卡片上未顯示「已註銷」）</li>
          <li>本人申辦的手機門號（4G/5G 月租，非預付卡、非公司門號）— 供「手機認證」登入</li>
          <li>或已申請「自然人憑證」＋讀卡機</li>
          <li>身分證統一編號</li>
        </ul>
      </div>
      <div class="apply-block">
        <div class="apply-label">🟢 線上申請</div>
        <a class="apply-link online" href="${links.online.url}" target="_blank" rel="noopener">
          <span class="al-text"><span class="al-main">${links.online.label}</span><span class="al-sub">${links.online.note}</span></span>
          <span class="al-arrow">↗</span>
        </a>
      </div>
      <div class="apply-block">
        <div class="apply-label">📄 表單下載</div>
        ${links.forms.map(f=>`
          <a class="apply-link form" href="${f.url}" target="_blank" rel="noopener">
            <span class="al-text"><span class="al-main">${f.name}</span></span>
            <span class="al-arrow">↓</span>
          </a>`).join('')}
      </div>`;
    } else {
      const o = links.onsite;
      html = `
      <div class="prep-box onsite">
        <div class="pb-title">🏢 現場辦，請先準備</div>
        <ul>${o.items.map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>
      <div class="onsite-card">
        <div class="oc-label">📍 要到哪裡去</div>
        <div class="oc-name">${o.name}</div>
        <div class="oc-row">🏠 ${o.addr}</div>
        <div class="oc-row">📞 ${o.phone}</div>
        <div class="oc-row">🕗 ${o.hours}</div>
      </div>`;
    }
  }

  if(history.length > 1){
    html += `<button class="back-full" onclick="goBack()">‹ 返回上一頁</button>`;
  }
  area.innerHTML = html;
  area.scrollTop = 0;
  if(key === 'retire_bli'){ calcBreakeven(); }
}

function journeyHTML(step){
  const labels = ['舊制退休金','勞保給付','勞退專戶'];
  return `<div class="journey">` + labels.map((l,i)=>{
    const idx = i+1;
    return `<div class="stop ${idx===step?'active':''}"><div class="dot">${idx===step?'●':idx}</div><div class="lab">${l}</div></div>` +
      (i < labels.length-1 ? `<div class="bar"></div>` : '');
  }).join('') + `</div>`;
}

function go(key){
  history.push(key);
  render(key);
}
function goBack(){
  if(history.length>1){
    history.pop();
    render(history[history.length-1]);
  }
}

render('retire_home');
</script>
